<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Inventory Calculator Application</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --result-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2rem;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
        }

        .app-layout {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }

        /* Sidebar Tabs */
        .sidebar {
            width: 300px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar-header {
            background: #f1f5f9;
            padding: 1rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-list {
            display: flex;
            flex-direction: column;
            padding: 0.5rem;
            gap: 0.25rem;
        }

        .tab-button {
            padding: 0.75rem 1rem;
            background: transparent;
            border: none;
            text-align: left;
            font-size: 0.95rem;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-button:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .tab-button.active {
            background: #e0e7ff;
            color: var(--primary);
            font-weight: 600;
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
        }

        .formula-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .formula-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .formula-desc {
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .formula-box {
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            color: #3730a3;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        /* Inputs */
        .inputs-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .input-group input {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* Results Card */
        .result-card {
            background: var(--result-bg);
            border-radius: 12px;
            padding: 2rem;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .result-label {
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .result-value {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            word-break: break-all;
        }

        .result-hint {
            color: #94a3b8;
            font-size: 0.9rem;
            border-top: 1px solid #334155;
            padding-top: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
            .calc-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Inventory Calculator App</h1>
            <p>Master your inventory metrics and formulas</p>
        </header>

        <div class="app-layout">
            <!-- Sidebar Navigation -->
            <aside class="sidebar">
                <div class="sidebar-header">Calculators</div>
                <div class="tab-list" id="tab-list">
                    <!-- Tabs rendered by JS -->
                </div>
            </aside>

            <!-- Main Calculator Window -->
            <main class="main-content">
                <div class="formula-header">
                    <h2 class="formula-title" id="display-title">Title</h2>
                    <p class="formula-desc" id="display-desc">Description</p>
                    <div class="formula-box" id="display-math">Formula</div>
                </div>

                <div class="calc-grid">
                    <div class="inputs-section" id="inputs-container">
                        <!-- Inputs rendered by JS -->
                    </div>

                    <div class="result-card">
                        <div class="result-label">Calculated Result</div>
                        <div class="result-value" id="display-result">0.00</div>
                        <div class="result-hint" id="display-hint">Hint</div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // Database of all formulas and their logic
        const formulas = [
            {
                id: 'cogs',
                title: 'Cost of Goods Sold (COGS)',
                description: 'Calculates the direct costs attributable to the production of the goods sold in a company.',
                math: 'COGS = Beg. Inventory + Purchases - End. Inventory',
                inputs: [
                    { id: 'begInv', label: 'Beginning Inventory ($)' },
                    { id: 'purchases', label: 'Purchases during period ($)' },
                    { id: 'endInv', label: 'Ending Inventory ($)' }
                ],
                calc: (v) => ({ value: (v.begInv||0) + (v.purchases||0) - (v.endInv||0), type: 'currency' })
            },
            {
                id: 'avg_inventory',
                title: 'Average Inventory',
                description: 'Estimates the amount or value of a product that a business has on hand over a specific period.',
                math: 'Avg Inventory = (Beginning + Ending) / 2',
                inputs: [
                    { id: 'begInv', label: 'Beginning Inventory' },
                    { id: 'endInv', label: 'Ending Inventory' }
                ],
                calc: (v) => ({ value: ((v.begInv||0) + (v.endInv||0)) / 2, type: 'number' })
            },
            {
                id: 'turnover',
                title: 'Inventory Turnover Ratio',
                description: 'Measures how many times a company has sold and replaced inventory during a given period.',
                math: 'Turnover = COGS / Average Inventory',
                inputs: [
                    { id: 'cogs', label: 'Cost of Goods Sold (COGS)' },
                    { id: 'avgInv', label: 'Average Inventory' }
                ],
                calc: (v) => ({ value: !v.avgInv ? 0 : (v.cogs||0) / v.avgInv, type: 'ratio' })
            },
            {
                id: 'dsi',
                title: 'Days Sales of Inventory (DSI)',
                description: 'Indicates the average number of days it takes a company to turn its inventory into sales.',
                math: 'DSI = (Average Inventory / COGS) × Days in Period',
                inputs: [
                    { id: 'avgInv', label: 'Average Inventory' },
                    { id: 'cogs', label: 'Cost of Goods Sold (COGS)' },
                    { id: 'days', label: 'Days in Period (usually 365)', default: 365 }
                ],
                calc: (v) => ({ value: !v.cogs ? 0 : ((v.avgInv||0) / v.cogs) * (v.days||365), type: 'days' })
            },
            {
                id: 'eoq',
                title: 'Economic Order Quantity (EOQ)',
                description: 'The ideal order quantity a company should purchase to minimize inventory costs.',
                math: 'EOQ = √ ( (2 × Demand × Order Cost) / Holding Cost )',
                inputs: [
                    { id: 'demand', label: 'Annual Demand (units)' },
                    { id: 'orderCost', label: 'Cost per Order ($)' },
                    { id: 'holdingCost', label: 'Holding Cost per Unit/Year ($)' }
                ],
                calc: (v) => ({ value: !v.holdingCost ? 0 : Math.sqrt((2 * (v.demand||0) * (v.orderCost||0)) / v.holdingCost), type: 'units' })
            },
            {
                id: 'rop',
                title: 'Reorder Point (ROP)',
                description: 'The specific level at which your stock needs to be replenished to avoid running out.',
                math: 'ROP = (Avg Daily Usage × Lead Time) + Safety Stock',
                inputs: [
                    { id: 'dailyUsage', label: 'Average Daily Usage (units)' },
                    { id: 'leadTime', label: 'Lead Time (days)' },
                    { id: 'safetyStock', label: 'Safety Stock (units)', default: 0 }
                ],
                calc: (v) => ({ value: ((v.dailyUsage||0) * (v.leadTime||0)) + (v.safetyStock||0), type: 'units' })
            },
            {
                id: 'safety_stock',
                title: 'Safety Stock',
                description: 'Extra inventory held to mitigate the risk of stockouts.',
                math: 'Safety = (Max Usage × Max Lead) - (Avg Usage × Avg Lead)',
                inputs: [
                    { id: 'maxUsage', label: 'Maximum Daily Usage (units)' },
                    { id: 'maxLead', label: 'Maximum Lead Time (days)' },
                    { id: 'avgUsage', label: 'Average Daily Usage (units)' },
                    { id: 'avgLead', label: 'Average Lead Time (days)' }
                ],
                calc: (v) => ({ value: Math.max(0, ((v.maxUsage||0) * (v.maxLead||0)) - ((v.avgUsage||0) * (v.avgLead||0))), type: 'units' })
            },
            {
                id: 'gmroi',
                title: 'GMROI',
                description: 'Gross Margin Return on Investment evaluates inventory profitability.',
                math: 'GMROI = Gross Margin / Average Inventory Cost',
                inputs: [
                    { id: 'grossMargin', label: 'Gross Margin ($)' },
                    { id: 'avgInvCost', label: 'Average Inventory Cost ($)' }
                ],
                calc: (v) => ({ value: !v.avgInvCost ? 0 : (v.grossMargin||0) / v.avgInvCost, type: 'ratio' })
            }
        ];

        // Application State
        let activeTabId = formulas[0].id;
        let currentValues = {};

        // DOM Elements
        const tabListEl = document.getElementById('tab-list');
        const inputsContainerEl = document.getElementById('inputs-container');
        const displayTitleEl = document.getElementById('display-title');
        const displayDescEl = document.getElementById('display-desc');
        const displayMathEl = document.getElementById('display-math');
        const displayResultEl = document.getElementById('display-result');
        const displayHintEl = document.getElementById('display-hint');

        // Formatter function
        function formatOutput(val, type) {
            if (isNaN(val) || !isFinite(val)) return '0.00';
            
            switch (type) {
                case 'currency': return '$' + val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                case 'ratio': return val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' : 1';
                case 'days': return val.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' days';
                case 'units': return Math.ceil(val).toLocaleString('en-US') + ' units';
                default: return val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
        }

        // Hint generator function
        function getHint(type) {
            switch (type) {
                case 'units': return "Physical items are rounded up to the nearest whole unit.";
                case 'ratio': return "Expresses the relationship between metric and investment.";
                case 'currency': return "Financial value based on current inputs.";
                case 'days': return "Estimated duration based on metrics.";
                default: return "Standard numeric calculation.";
            }
        }

        // Core Render Function
        function renderApp() {
            const activeFormula = formulas.find(f => f.id === activeTabId);

            // 1. Render Tabs
            tabListEl.innerHTML = formulas.map(f => `
                <button class="tab-button ${f.id === activeTabId ? 'active' : ''}" onclick="switchTab('${f.id}')">
                    ${f.title}
                </button>
            `).join('');

            // 2. Update Header Info
            displayTitleEl.textContent = activeFormula.title;
            displayDescEl.textContent = activeFormula.description;
            displayMathEl.textContent = activeFormula.math;

            // 3. Set Defaults if empty
            currentValues = {};
            activeFormula.inputs.forEach(inp => {
                if (inp.default !== undefined) currentValues[inp.id] = inp.default;
            });

            // 4. Render Input Fields
            inputsContainerEl.innerHTML = activeFormula.inputs.map(inp => `
                <div class="input-group">
                    <label for="${inp.id}">${inp.label}</label>
                    <input 
                        type="number" 
                        id="${inp.id}" 
                        value="${currentValues[inp.id] ?? ''}"
                        placeholder="0.00"
                        oninput="updateValue('${inp.id}', this.value)"
                    >
                </div>
            `).join('');

            calculateAndDisplay();
        }

        // Action Handlers
        window.switchTab = function(id) {
            activeTabId = id;
            renderApp();
        };

        window.updateValue = function(id, value) {
            currentValues[id] = value === '' ? undefined : Number(value);
            calculateAndDisplay();
        };

        function calculateAndDisplay() {
            const activeFormula = formulas.find(f => f.id === activeTabId);
            const result = activeFormula.calc(currentValues);
            
            displayResultEl.textContent = formatOutput(result.value, result.type);
            displayHintEl.textContent = getHint(result.type);
        }

        // Boot the app
        renderApp();
    </script>
</body>
</html>
